name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      # n8n-workflow pulls in isolated-vm, which has no prebuilt binary for every Node ABI and then
      # fails to compile from source. Nothing here needs it at runtime, so native scripts are skipped.
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm test
