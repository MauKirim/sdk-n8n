name: Release

# Publishing is tag-driven: push a `v*` tag on the commit you want to ship.
#   npm version minor --message "chore: release v%s" && git push --follow-tags
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # npm provenance

jobs:
  publish:
    name: Publish n8n-nodes-maukirim to npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm

      - run: npm ci --ignore-scripts # see ci.yml: isolated-vm has no prebuilt binary for every ABI

      - name: Tag must match package.json version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag v$tag does not match package.json version $pkg"
            exit 1
          fi
          echo "Releasing n8n-nodes-maukirim@$pkg"

      - run: npm run build
      - run: npm test

      - name: Publish
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Verify the published package with n8n's scanner
        # n8n rejects a community package whose source or tarball breaks its lint gate, so the
        # release is not considered done until their own scanner accepts what we just published.
        run: |
          pkg="$(node -p "require('./package.json').version")"
          for attempt in 1 2 3 4 5 6; do
            if npx --yes @n8n/scan-community-package@beta "n8n-nodes-maukirim@${pkg}"; then
              echo "n8n scanner accepted n8n-nodes-maukirim@${pkg}"
              exit 0
            fi
            echo "::warning::scanner attempt ${attempt} failed; the registry may still be propagating"
            sleep 45
          done
          echo "::error::n8n's scanner rejected n8n-nodes-maukirim@${pkg}"
          exit 1
