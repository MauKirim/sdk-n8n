name: Release

# Publishing is tag-driven: push a `v*` tag on the commit you want to ship.
#   npm version minor --message "chore: release v%s" && git push --follow-tags
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # npm provenance

jobs:
  publish:
    name: Publish n8n-nodes-maukirim to npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm

      - run: npm ci --ignore-scripts # see ci.yml: isolated-vm has no prebuilt binary for every ABI

      - name: Tag must match package.json version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag v$tag does not match package.json version $pkg"
            exit 1
          fi
          echo "Releasing n8n-nodes-maukirim@$pkg"

      - run: npm run build
      - run: npm test

      - name: Publish
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Verify the published package with n8n's scanner
        # n8n rejects a community package whose source or tarball breaks its lint gate, so the
        # release is not considered done until their own scanner accepts what we just published.
        run: |
          pkg="$(node -p "require('./package.json').version")"
          registry_url="https://registry.npmjs.org/n8n-nodes-maukirim/${pkg}"

          # A publish can take several minutes to become visible, and the scanner cannot see an
          # unpublished version, so wait for the registry first.
          code=""
          for attempt in $(seq 1 30); do
            code="$(curl -s -o /dev/null -w '%{http_code}' "$registry_url")"
            [ "$code" = "200" ] && break
            echo "waiting for ${pkg} to appear on the registry (attempt ${attempt}, HTTP ${code})"
            sleep 20
          done
          if [ "$code" != "200" ]; then
            echo "::error::n8n-nodes-maukirim@${pkg} never became available on the registry"
            exit 1
          fi

          # The scanner exits 0 even when it reports a failure, so the verdict has to be read from
          # its output rather than from the exit code.
          output="$(npx --yes @n8n/scan-community-package@beta "n8n-nodes-maukirim@${pkg}" 2>&1 || true)"
          printf '%s\n' "$output"
          if ! printf '%s' "$output" | grep -q 'passed all security checks'; then
            echo "::error::n8n's scanner did not accept n8n-nodes-maukirim@${pkg}"
            exit 1
          fi
          echo "n8n's scanner accepted n8n-nodes-maukirim@${pkg}"
